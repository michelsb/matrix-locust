[tool.poetry]
name = "matrix-locust"
version = "0.1.0"
description = "Load testing for Matrix in Python using Locust"
license = "Apache-2.0"
authors = [
    "Charles Wright <cvwright@futo.org>",
    "Michael Hollister <michael@futo.org>"
]
readme = "README.md"
repository = "https://gitlab.futo.org/load-testing/matrix-locust"
keywords = ["matrix", "locust", "loadtest"]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
locust = "2.46.3"
matrix-nio = "0.26.0"
python-dotenv = ">=1.0.1"
requests = ">=2.32.3"
urllib3 = ">=2.3.0"
pandas = ">=2.3,<4"
matplotlib = ">=3.10,<4"
scipy = ">=1.16,<2"
statsmodels = ">=0.14.5,<0.15"

[build-system]
requires = ["poetry-core>=1.0.0",]
build-backend = "poetry.core.masonry.api"
